<!DOCTYPE html>
<html lang="es">

    />

    <meta
      property="og:description"
      content="Descubre tu perfil financiero en 2 minutos. Quiz gratuito con plan personalizado."
    />
    <!-- TODO: Reemplazar con favicon real de Educly -->
    <link
      rel="icon"
      type="image/png"

    />
    <title>Quiz de Finanzas – Educly</title>
    <style>
      body { background-color: #FFFFFF; }
      #root { height: 100%; }
      .preloader {
        display: flex;
        height: 100%;
        width: 100%;
        justify-content: center;
        align-items: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid transparent;
        border-top: 4px solid rgba(108, 99, 255, 0.6);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="preloader"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
